spring.application.name=inventory-manager
server.port=8081
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Loads local secrets from .env (ignored when the file doesn't exist, e.g. on a server)
spring.config.import=optional:file:.env[.properties]

# Database: no defaults on purpose, the app must fail fast if they are missing
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT (access token: 15 minutes; refresh token: 7 days)
jwt-secret=${JWT_SECRET}
jwt-expiration-milliseconds=${JWT_EXPIRATION_MS:900000}
jwt-refresh-expiration-milliseconds=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}